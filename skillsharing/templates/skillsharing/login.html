{% extends "base.html" %}

{% load static %}

{% block main %}

        <h1>Connexion</h1>

        <form method="post" class="help-request-form">
            {% csrf_token %}

            {{ form.as_p }}

            <button type="submit" class="submit-btn">Se connecter</button>
        </form>

        <a href="{% url 'skillsharing:index' %}">
            Continuer en tant que visiteur
        </a>
    </div>
{% endblock %}
