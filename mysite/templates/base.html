<!DOCTYPE html>

{% load static %}

<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Skilsharing{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'mysite/style.css' %}">
</head>
<body>

    <header>
        <div class="site-header">
            <h1 class="site-title">Skill Sharing</h1>
            {% block header %}
            {% endblock %}
        </div>
        <div class="navbar">
            <a href="{% url 'skillsharing:index' %}">Accueil</a>
            {% if user.is_authenticated %}
                <a href="{% url 'skillsharing:add_help_request' %}">Demander de l'aide</a>
                <a href="{% url 'skillsharing:help_requests' %}">Consulter les demandes d'aide</a>
            {% endif %}
        </div>
    </header>

    <main>
        {% block main %}
        {% endblock %}
    </main>

</body>
</html>
